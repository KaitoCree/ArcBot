# Every player-facing string lives here. Edit freely; the bot reads this at startup.
# TONE: friendly, guild-flavored, short sentences. Never use the words "application",
# "verification", "review" or "rejected" in player-facing text. NEVER show point values.
# Placeholders in {braces}.

apply:
  prompt_title: "Welcome to The Raider's Outpost"
  prompt_body: >
    Let's find you a spot in the guild. It takes about a minute.


    **Which screen:** in game go to **Raider > Codex > Player Stats**, then pick the
    **Progression & Economy** tab next to Player Stats. Screenshot the whole screen (the numbers along
    the top and the list below). Then tap **Show us your stats**.


    No luck with a screenshot? No problem, there's a button for that too.
  btn_show_stats: "Show us your stats"
  btn_manual: "Can't upload a clear screenshot?"
  btn_skip: "Skip for now"
  modal_title: "Show us your stats"
  modal_name_label: "Your in-game name"
  modal_name_optional_label: "Your in-game name (optional)"
  modal_name_optional_hint: "Leave it blank and we'll read it from your screenshot."
  modal_file_label: "Player Stats screenshot"
  modal_file_hint: "Raider > Codex > Player Stats > Progression & Economy tab. Whole screen, please."
  skip_done: "You're in as a {rank}. Welcome! You can come to #rank-promotion any time to show us your stats."
  join_ping: "Welcome to the Outpost, {mention}! Tap one of the buttons above to find your spot in the guild."
  reading: "Taking a look at your screenshot..."
  readback_title: "Here's what we read. Look right?"
  readback_unsure_suffix: " (not sure about this one)"
  unsure_note: "We weren't 100% sure about the marked ones. If they match your screen, tap Looks right. If not, Fix numbers."
  btn_looks_right: "Looks right"
  btn_fix: "Fix numbers"
  manual_intro: "No worries. Open Raider > Codex > Player Stats and pick the Progression & Economy tab. The first five numbers run along the top, the rest are in the list below."
  manual_next: "Almost done. One more short page."
  btn_next: "Next"
  bad_number: "That one needs to be a number, like 350. Mind trying again?"
  bad_hours: "Hours look like 268:02:47 (or just 268). Mind trying again?"
  missing_fields: "We couldn't read {fields} from that screenshot. Mind typing {them}? (Tip: the Progression & Economy tab shows everything we need.)"
  btn_type_missing: "Type them in"
  already_placed: "You're already in! Head to #rank-promotion any time you want to show us new stats."
  pending_wait: "A mod is still looking at your last stats. Hang tight, you'll hear from us soon."
  bad_file: "That file didn't work. Send a PNG or JPG of your Player Stats screen, up to {max_mb} MB."
  session_expired: "That form timed out. Mind starting again from the button?"
  manual_title_1: "Your stats (1 of 2)"
  manual_title_2: "Your stats (2 of 2)"
  fix_title: "Fix the numbers"
  missing_title: "Just a few numbers"
  unreadable_value: "couldn't read"
  fields:
    hours: "Total time spent topside"
    knockouts: "Players knocked out"
    squad_revives: "Times revived a squadmate"
    stranger_revives: "Times revived a stranger"
    quests: "Quests completed"
    containers: "Containers looted"
    expeditions: "Expeditions completed"
  hours_hint: "Like 268:02:47 or just 268"

placement:
  placed: "Welcome aboard, {name} the {rank}!"
  pending: "Nice stats! A guild mod will take a quick look and confirm your rank. Until then you're set up as a {provisional_rank}, so jump right in."
  approved_dm: "Good news, a mod confirmed you as {name} the {rank}. Welcome in!"
  denied_dm: "We couldn't quite make out your stats. A clearer screenshot of the Player Stats screen will do it. Try again any time from #rank-promotion."
  already_at_or_above: "Your stats match or sit below your current rank, so nothing changes. Keep going, you're doing great."
  rank_up: "{name} just became {rank}. Nice work!"
  you_are_placed: "You're in as {name} the {rank}. Welcome aboard!"
  dm_fallback: "{mention} {message}"

promotion:
  prompt_title: "Ready for a promotion?"
  prompt_body: "Show us your latest stats and we'll see if you've earned a higher rank: **Raider > Codex > Player Stats**, then the **Progression & Economy** tab, whole screen. You can do this once every {days} days."
  btn_update: "Update my stats"
  cooldown: "You can show us again in {days_left} days. Keep playing and come back!"
  veteran_note: "You're already a Veteran. Nothing higher to climb!"
  not_placed: "We couldn't find a guild rank on your account yet. Ask a mod to check your rank role."

vouch:
  reaction: "🤝"
  hint: "Vouches need a few words about what they did, like \"@name helped me finish the Spaceport quests\". Or use /vouch."
  context_menu: "Vouch for this member"
  modal_title: "Vouch for a raider"
  reason_label: "What did they do?"
  reason_placeholder: "Carried me through Dam Battlegrounds and shared their meds"
  posted: "🤝 {voucher} vouched for {member}: {reason}"
  done: "Thanks! Your vouch is up in #vouch."
  need_words: "Tell us a bit more about what they did (at least {min_words} words)."
  not_self: "You can't vouch for yourself!"
  not_bot: "Bots don't need vouches, but thanks!"

